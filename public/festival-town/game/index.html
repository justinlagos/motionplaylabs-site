  /* cloth on a line */
  const a = isoPt(u - 1.3, v + 1.4, 70), b = isoPt(u + .6, v + 1.6, 70);
  s += `<path d="M${a[0]} ${a[1]} Q${(a[0] + b[0]) / 2} ${(a[1] + b[1]) / 2 + 16} ${b[0]} ${b[1]}" stroke="#55546A" stroke-width="2" fill="none"/>`;
  [['url(#c-adire)', .2], ['#D6336C', .45], ['url(#c-adire)', .7]].forEach(([f, t]) => { const x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t + 12; s += `<rect x="${x - 16}" y="${y}" width="32" height="46" rx="3" fill="${f}" class="sway" style="transform-origin:${x}px ${y}px"/>`; });
  s += `<path d="M${a[0]} ${a[1]} V${a[1] + 74} M${b[0]} ${b[1]} V${b[1] + 74}" stroke="#8C5428" stroke-width="4"/>`;
  const top = isoPt(u, v, 176);
  s += `<g transform="translate(${top[0]} ${top[1] + 4})"><g class="sign">${signScissors()}</g></g>`;
  return s + '</g>';
}

function isoBridge(){
  const q = (u, v, z = 0) => isoPt(u, v, z);
  let s = '<g class="t-bridge">';
  const U = [6.0, 6.7, 7.4, 8.1, 8.8], Z = [0, 14, 20, 14, 0], v0 = -2.45, v1 = -1.75;
  for (let i = 0; i < 4; i++) s += poly([q(U[i], v0, Z[i]), q(U[i + 1], v0, Z[i + 1]), q(U[i + 1], v1, Z[i + 1]), q(U[i], v1, Z[i])], i % 2 ? '#C98A4E' : '#B57A3E', 'stroke="#8C5428" stroke-width="2"');
  for (let i = 0; i <= 4; i++){ const a = q(U[i], v0, Z[i]), b = q(U[i], v1, Z[i]); s += `<path d="M${a[0]} ${a[1]} v-26 M${b[0]} ${b[1]} v-26" stroke="#8C5428" stroke-width="5"/>`; }
  for (const v of [v0, v1]) s += `<path d="M${P(U.map((u, i) => { const p = q(u, v, Z[i]); return [p[0], p[1] - 24]; }))}" stroke="#D6336C" stroke-width="5" fill="none"/>`;
  return s + '</g>';
}

/* ===== Journey-map drawing kit (top-down storybook style, 1600 x 720 design) =====
   Keep the road and stops inside x 300..1300 and y 120..570: that part shows on every screen size.
   Things near the edges are decoration only. */
const MAPX = {
  ground(c1, c2){ return `<defs><radialGradient id="mg-${c1.slice(1)}" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs><rect width="1600" height="720" fill="url(#mg-${c1.slice(1)})"/>`; },
  speckle(col, n = 140, seed = 3){ let s = '', k = seed * 7919; const R = () => ((k = (k * 16807) % 2147483647) / 2147483647); for (let i = 0; i < n; i++) s += `<circle cx="${(R() * 1600).toFixed(0)}" cy="${(R() * 720).toFixed(0)}" r="${(2 + R() * 4).toFixed(1)}" fill="${col}" opacity="${(.25 + R() * .3).toFixed(2)}"/>`; return s; },
  shadow(x, y, rx, ry){ return `<ellipse cx="${x + 6}" cy="${y + 8}" rx="${rx}" ry="${ry}" fill="#2B1020" opacity=".14"/>`; },
  tree(x, y, r = 40, c1 = '#4FB36A', c2 = '#2F8A4C'){ return this.shadow(x, y, r * 1.05, r * .9) + `<circle cx="${x - r * .4}" cy="${y + r * .1}" r="${r * .7}" fill="${c2}"/><circle cx="${x + r * .42}" cy="${y + r * .05}" r="${r * .72}" fill="${c2}"/><circle cx="${x}" cy="${y - r * .3}" r="${r * .8}" fill="${c1}"/><circle cx="${x - r * .25}" cy="${y - r * .55}" r="${r * .28}" fill="#FFF" opacity=".16"/>`; },
  palm(x, y, r = 46){ let s = this.shadow(x, y, r * .9, r * .6); for (let i = 0; i < 7; i++){ const a = i * Math.PI * 2 / 7 + .3, ex = x + Math.cos(a) * r, ey = y + Math.sin(a) * r * .8; s += `<path d="M${x} ${y} Q${(x + ex) / 2 + Math.sin(a) * 10} ${(y + ey) / 2 - 12} ${ex.toFixed(0)} ${ey.toFixed(0)}" stroke="${i % 2 ? '#2F8A4C' : '#4FB36A'}" stroke-width="13" fill="none" stroke-linecap="round"/>`; } return s + `<circle cx="${x}" cy="${y}" r="9" fill="#8C5A36"/>`; },
  bush(x, y, r = 20, c = '#5DBE74'){ return `<circle cx="${x - r * .6}" cy="${y}" r="${r * .7}" fill="${c}"/><circle cx="${x + r * .6}" cy="${y}" r="${r * .7}" fill="${c}"/><circle cx="${x}" cy="${y - r * .35}" r="${r * .8}" fill="${c}"/><circle cx="${x - r * .2}" cy="${y - r * .55}" r="${r * .22}" fill="#FFF" opacity=".2"/>`; },
  flowers(x, y, cols = ['#D6336C', '#FFD23F', '#FFF8EC']){ return [[0, 0], [14, -8], [26, 4], [8, 12]].map(([dx, dy], i) => `<circle cx="${x + dx}" cy="${y + dy}" r="6" fill="${cols[i % cols.length]}"/><circle cx="${x + dx}" cy="${y + dy}" r="2.4" fill="#F5A623"/>`).join(''); },
  rock(x, y, r = 18, c = '#B9AFA6'){ return `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .7}" fill="${c}"/><ellipse cx="${x - r * .3}" cy="${y - r * .25}" rx="${r * .4}" ry="${r * .22}" fill="#FFF" opacity=".3"/>`; },
  umbrella(x, y, r = 48, cols = ['#D6336C', '#FFF6E6']){ let s = this.shadow(x, y, r, r * .85); const n = 8; for (let i = 0; i < n; i++){ const a0 = i * Math.PI * 2 / n, a1 = (i + 1) * Math.PI * 2 / n; s += `<path d="M${x} ${y} L${(x + Math.cos(a0) * r).toFixed(1)} ${(y + Math.sin(a0) * r).toFixed(1)} A${r} ${r} 0 0 1 ${(x + Math.cos(a1) * r).toFixed(1)} ${(y + Math.sin(a1) * r).toFixed(1)}Z" fill="${cols[i % cols.length]}"/>`; } return s + `<circle cx="${x}" cy="${y}" r="5" fill="#2B1B2E" opacity=".5"/>`; },
  roofBox(x, y, w, hh, wall, roof, ridge = true){ return this.shadow(x + w / 2, y + hh / 2, w * .55, hh * .55) + `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="8" fill="${wall}"/><path d="M${x - 6} ${y + hh * .5} L${x + w / 2} ${y - 8} L${x + w + 6} ${y + hh * .5}Z" fill="${roof}"/>` + (ridge ? `<path d="M${x - 6} ${y + hh * .5} L${x + w / 2} ${y - 8} L${x + w + 6} ${y + hh * .5}" stroke="#FFF" stroke-width="3" opacity=".35" fill="none"/>` : '') + `<rect x="${x + w * .4}" y="${y + hh * .62}" width="${w * .2}" height="${hh * .38}" rx="3" fill="#8C5428"/>`; },
  table(x, y, w, hh, cloth, goods){ let s = this.shadow(x + w / 2, y + hh / 2, w * .55, hh * .6) + `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="6" fill="${cloth}"/><rect x="${x}" y="${y + hh - 8}" width="${w}" height="8" rx="4" fill="#2B1020" opacity=".15"/>`; (goods || []).forEach(([dx, dy, c, r]) => s += `<circle cx="${x + dx}" cy="${y + dy}" r="${r || 7}" fill="${c}"/><circle cx="${x + dx - 2}" cy="${y + dy - 2}" r="${(r || 7) * .3}" fill="#FFF" opacity=".5"/>`); return s; },
  pond(x, y, rx, ry, c = '#6CC7E8'){ return `<ellipse cx="${x}" cy="${y + 6}" rx="${rx + 8}" ry="${ry + 6}" fill="#E8C98A"/><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${c}"/><path d="M${x - rx * .5} ${y - ry * .2} q14 -6 28 0 M${x + rx * .1} ${y + ry * .3} q14 -6 28 0" stroke="#BFE6F2" stroke-width="5" fill="none" stroke-linecap="round"/>`; },
  field(x, y, w, hh, soil = '#B5784A', crop = '#4FB36A', rows = 4){ let s = `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="10" fill="${soil}"/>`; for (let r = 0; r < rows; r++){ const yy = y + (r + .5) * hh / rows; s += `<path d="M${x + 10} ${yy} H${x + w - 10}" stroke="#8C5428" stroke-width="5" opacity=".5"/>`; for (let k = x + 20; k < x + w - 10; k += 26) s += `<circle cx="${k}" cy="${yy - 4}" r="7" fill="${crop}"/>`; } return s; },
  fence(x1, y1, x2, y2, c = '#C98A4E'){ const n = Math.max(2, Math.round(Math.hypot(x2 - x1, y2 - y1) / 26)); let s = `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${c}" stroke-width="5"/>`; for (let i = 0; i <= n; i++){ const x = x1 + (x2 - x1) * i / n, y = y1 + (y2 - y1) * i / n; s += `<rect x="${x - 4}" y="${y - 10}" width="8" height="16" rx="2" fill="${c}"/>`; } return s; },
  car(x, y, c = '#FFD23F', rot = 0){ return `<g transform="translate(${x} ${y}) rotate(${rot})">${this.shadow(0, 0, 50, 24)}<rect x="-48" y="-22" width="96" height="44" rx="14" fill="${c}"/><rect x="-26" y="-18" width="44" height="36" rx="8" fill="#2B2A3A" opacity=".75"/><rect x="-44" y="-24" width="12" height="6" rx="2" fill="#2B2A3A"/><rect x="-44" y="18" width="12" height="6" rx="2" fill="#2B2A3A"/><rect x="28" y="-24" width="12" height="6" rx="2" fill="#2B2A3A"/><rect x="28" y="18" width="12" height="6" rx="2" fill="#2B2A3A"/><path d="M-48 -6 H48 M-48 6 H48" stroke="#2B2A3A" stroke-width="3" opacity=".7"/></g>`; },
  person(x, y, top = '#D6336C', head = '#7B4A2E', hat){ return this.shadow(x, y + 4, 12, 7) + `<circle cx="${x}" cy="${y + 2}" r="12" fill="${top}"/><circle cx="${x}" cy="${y - 6}" r="9" fill="${head}"/>` + (hat ? `<circle cx="${x}" cy="${y - 9}" r="8" fill="${hat}"/>` : ''); },
  landmark(x, y, svg, w){ return `<g transform="translate(${x - w / 2} ${y - w})">${nest(svg, w, w)}</g>`; }

/* ---------- walking on the town and maps ---------- */
function makeWalker(w, cls){
  const el = h('div', { class:'walker ' + cls }, '<div class="flip"><div class="hopper"></div></div>');
  const a = makeActor(w); a.style.position = 'relative'; el.querySelector('.hopper').append(a);
  return el;
}
function placeWalker(el, x, y){ el._wx = x; el._wy = y; el.style.transition = 'none'; el.style.transform = `translate(${x - el.offsetWidth / 2}px,${y - el.offsetHeight}px)`; }
function walkTo(el, x, y, speed = .55){
  return new Promise(res => {
    const x0 = el._wx || 0, y0 = el._wy || 0, d = Math.hypot(x - x0, y - y0), ms = Math.max(300, d / speed) * FAST;
    el.classList.toggle('face-left', x < x0 - 2); el.classList.add('walking');
    el.style.transition = `transform ${ms}ms linear`;
    el.style.transform = `translate(${x - el.offsetWidth / 2}px,${y - el.offsetHeight}px)`;
    el._wx = x; el._wy = y;
    setTimeout(() => { el.classList.remove('walking'); res(); }, ms + 20);
  });
}

const Town = {
  hero:null, zizi:null, busy:false,
  async enter(o = {}){

/* ===================== a world's journey map ===================== */
function smoothPath(pts){
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d;
}
const DEFAULT_MAP_PTS = [[340, 540], [520, 380], [790, 425], [1010, 275], [1240, 185]];
function mapRoad(W){
  const pts = W.map.pts || DEFAULT_MAP_PTS, d = smoothPath(pts);
  const p = Store.p(), doneN = Store.worldDone(W.id);
  const upto = smoothPath(pts.slice(0, Math.min(pts.length, doneN + 2)));
  return `<path d="${d}" stroke="${W.map.edge || '#C9A06A'}" stroke-width="62" fill="none" stroke-linecap="round" opacity=".55"/>
    <path d="${d}" stroke="${W.map.road || '#FFF3D9'}" stroke-width="48" fill="none" stroke-linecap="round"/>
    <path d="${d}" stroke="${W.map.dash || '#E3C58F'}" stroke-width="7" fill="none" stroke-dasharray="4 22" stroke-linecap="round"/>
    <path d="${upto}" stroke="${W.color}" stroke-width="9" fill="none" stroke-dasharray="2 20" stroke-linecap="round"/>
    <circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="34" fill="${W.color}" opacity=".25"/><circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="20" fill="${W.color}"/>`;
}

/* ===================== portal adapter =====================
   One build per portal. PORTAL_TARGET is set by the build script; on the
   plain web build it stays 'none' and every call below does nothing.
   Portals that serve ads get gameplayStart / gameplayStop around each
   activity and an ad break only BETWEEN activities, never inside a round. */
const Portal = (() => {
  const TARGET = 'none';
  const MIN_GAP_MS = 120000;          /* GameDistribution allows a 2 minute timer */
  let sdk = null, lastAd = 0, playing = false, booted = false;

  const loadScript = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });

  async function boot(){
    if (booted) return; booted = true;
    try {
      if (TARGET === 'crazygames'){
        await loadScript('https://sdk.crazygames.com/crazygames-sdk-v3.js');
        sdk = window.CrazyGames && window.CrazyGames.SDK;
        if (sdk) await sdk.init();
      } else if (TARGET === 'poki'){
        await loadScript('https://game-cdn.poki.com/scripts/v2/poki-sdk.js');
        sdk = window.PokiSDK;
        if (sdk) await sdk.init();
      } else if (TARGET === 'gamedistribution'){
        window.GD_OPTIONS = {
          gameId: '__GD_GAME_ID__',
          onEvent(e){ if (e.name === 'SDK_GAME_PAUSE') silence(true); if (e.name === 'SDK_GAME_START') silence(false); }
        };
        await loadScript('https://html5.api.gamedistribution.com/main.min.js');
        sdk = window.gdsdk || null;
      }
    } catch (e){ sdk = null; }   /* a blocked or missing SDK must never stop the game */
  }

  /* everything audible off during an ad, back on after */
  function silence(on){
    try {
      if (on){ stopSpeech(); musicStop(); if (master && AC) master.gain.setTargetAtTime(0, AC.currentTime, .02); }
      else { if (master && AC) master.gain.setTargetAtTime(1, AC.currentTime, .05);
             if (Store.s.settings.music && AC) musicStart(); }
    } catch (e){}
  }

  /* After an ad the child comes back to a still screen and taps to carry on.
     It sits inside #stage so the remote's ring (tv.js) can reach it, and OK or Back
     on a keyboard, TV remote or controller dismisses it straight away. */
  const OK_KEYS = new Set(['Enter', ' ', 'Spacebar', 'Select', 'OK', 'NumpadEnter',
                           'Escape', 'Esc', 'GoBack', 'BrowserBack', 'XF86Back', 'Backspace']);
  const OK_CODES = new Set([13, 32, 23, 27, 8, 4, 166, 10009, 461, 65385]);
  function resumeScreen(){
    return new Promise(res => {
      const el = document.createElement('div');
      el.id = 'ad-resume';
      el.innerHTML = '<button type="button" class="btn">Tap to carry on</button>';
      let done = false;
      const go = () => {
        if (done) return; done = true;
        window.removeEventListener('keydown', onKey, true);
        el.remove(); res();
      };
      /* capture phase, so the game's own key handling never sees these presses */
      const onKey = e => {
        e.preventDefault(); e.stopImmediatePropagation();
        if (OK_KEYS.has(e.key) || OK_CODES.has(e.keyCode)) go();
      };
      el.querySelector('button').addEventListener('click', go);
      el.addEventListener('click', go);
      window.addEventListener('keydown', onKey, true);
      (document.getElementById('stage') || document.body).appendChild(el);
      try { el.querySelector('button').focus({ preventScroll: true }); } catch (e) {}
    });
  }

  /* An ad call that never calls back would leave a child staring at a frozen
     screen, so every one of them races a timer and the game carries on. */
  const AD_TIMEOUT_MS = 12000;
  function withTimeout(p){
    return new Promise(res => {
      let done = false;
      const finish = () => { if (!done){ done = true; res(); } };
      const t = setTimeout(finish, AD_TIMEOUT_MS);
      Promise.resolve(p).then(() => { clearTimeout(t); finish(); }, () => { clearTimeout(t); finish(); });
    });
  }

  async function runAd(kind){
    if (!sdk && TARGET !== 'gamedistribution') return;
    let shown = false;
    silence(true);
    try {
      if (TARGET === 'crazygames' && sdk && sdk.ad && sdk.ad.requestAd){
        shown = true;
        await withTimeout(new Promise(res => {
          try { sdk.ad.requestAd('midgame', { adFinished: res, adError: res, adStarted(){} }); }
          catch (e){ res(); }
        }));
      } else if (TARGET === 'poki' && sdk && sdk.commercialBreak){
        shown = true;
        await withTimeout(sdk.commercialBreak());
      } else if (TARGET === 'gamedistribution' && window.gdsdk && window.gdsdk.showAd){
        shown = true;
        await withTimeout(window.gdsdk.showAd());
      }
    } catch (e){}
    lastAd = Date.now();
    silence(false);
    /* no ad was actually attempted, so there is nothing to come back from */
    if (shown) await resumeScreen();
  }

  return {
    boot,
    /* the first ad GameDistribution requires, after the child presses Play */
    async preroll(){
      if (TARGET !== 'gamedistribution') return;
      await boot(); await runAd('preroll');
    },
    /* a break between two activities; never called inside a round */
    async between(){
      if (TARGET === 'none' || TARGET === 'coolmath') return;
      if (Date.now() - lastAd < MIN_GAP_MS) return;
      await runAd('midroll');
    },
    start(){
      if (playing) return; playing = true;
      try {
        if (TARGET === 'crazygames' && sdk && sdk.game) sdk.game.gameplayStart();
        else if (TARGET === 'poki' && sdk) sdk.gameplayStart();
      } catch (e){}
    },
    stop(){
      if (!playing) return; playing = false;
      try {
        if (TARGET === 'crazygames' && sdk && sdk.game) sdk.game.gameplayStop();
        else if (TARGET === 'poki' && sdk) sdk.gameplayStop();
      } catch (e){}
    },
    target: TARGET,
    /* Coolmath takes no name entry and no code box */
    noNameEntry: TARGET === 'coolmath'
  };
})();

/* ===================== an activity: story, then play rounds on the board ===================== */
const Runner = {
  wid:null, sid:null,
  async enter(wid, sid){
    const tok = newRun(); this.wid = wid; this.sid = sid;
    const W = WORLDS[wid], st = W.stops.find(s => s.id === sid);
    const el = $('#scene');
    const bk = st.back();
    el.innerHTML = `<div class="bd">${bk.back || bk}</div><div class="host-slot"></div><div class="bd bd-front">${bk.front || ''}</div><div class="scrim"></div>
      <div id="board" hidden><div class="board-bg"></div><div id="play"></div><div id="bui"></div></div>`;
    for (const k in ACT) delete ACT[k];
    const host = makeActor(st.host, 'host-a'); $('.host-slot', el).append(host);
    el.append(makeActor('zizi', 'zizi-a'), makeActor('hero', 'hero-a'));
    showScreen('scene'); layout(); Portal.start();
    const prog = Store.stop(wid, sid), replay = !!prog.done;
    const t0 = Date.now();
    await Iris.open(140, 520);
    if (tok !== RUN) return;
    try {
      const ctx = { tok, replay, world:W, stop:st };
      if (replay || prog.round > 0) await (st.again || st.intro)(ctx); else await st.intro(ctx);
      for (let i = replay ? 0 : prog.round; i < st.rounds.length; i++){
        guard(tok);
        const S = { tok, replay, misses:0, hints:0, i, world:W, stop:st };
        if (!app.classList.contains('board-up')){ openBoard(W.theme || wid); await sleep(500); }
        else { $('#play').classList.add('fade'); $('#bui').classList.add('fade'); await sleep(260); clearBoard(); $('#play').classList.remove('fade'); $('#bui').classList.remove('fade'); }
        Rounds.set(i, st.rounds.length); currentPrompt = null; this.cur = { i, S };
        const rt0 = Date.now();
        await st.rounds[i](S);
        guard(tok);
        Store.log({ w:wid, s:sid, r:i, misses:S.misses, hints:S.hints, ms:Date.now() - rt0 });
        if (!replay){ prog.round = i + 1; Store.save(); }
        Rounds.set(i + 1, st.rounds.length);
        if (i < st.rounds.length - 1){ await sleep(250); if (Math.random() < .5) await say('well_done'); else { pulse(rigOf('zizi'), 'pushups', 1500); await say('zizi_cheer'); } }
      }
      guard(tok);
      await sleep(300); guard(tok);
      closeBoard(); currentPrompt = null; await sleep(450); guard(tok);
      await (st.outro ? st.outro(ctx) : standardOutro(ctx));
      guard(tok);
      prog.done = true; prog.round = 0; prog.plays = (prog.plays || 0) + 1;
      const p = Store.p(); p.playMs = (p.playMs || 0) + (Date.now() - t0); p.lastPlayed = Date.now();
      Store.save();
      await sleep(400);
      guard(tok);
      const r = stageRect(ACT[Store.hero()]);
      await Iris.close(r.x + r.w / 2, r.y + r.h / 2); guard(tok);
      Portal.stop();
      await Portal.between();
      WMap.enter(wid, { justDone:W.stops.indexOf(st) });
    } catch (e) { if (e !== CANCEL) throw e; }
  },
  back(){ Portal.stop(); return WMap.enter(this.wid); }
};
/* the usual ending: the host gives a thing for the festival */
async function standardOutro(ctx){
  const st = ctx.stop, sid = st.id, k = st.reward;
  const g0 = () => guard(ctx.tok);
  pose(st.host, 'give'); face(st.host, 'happy');
  await say(sid + '_gift'); g0();

  pose(st.host, 'idle'); face(st.host, 'neutral');
  await rewardToFestival(g); g0();

  face('hero', 'neutral');
}

/* ===================== the festival square ===================== */
function lightString(x1, y1, x2, y2, sag, n){
  let s = `<path d="M${x1} ${y1} Q${(x1 + x2) / 2} ${(y1 + y2) / 2 + sag * 2} ${x2} ${y2}" stroke="#2B1B2E" stroke-width="3" fill="none" opacity=".6"/>`;
  for (let i = 1; i < n; i++){ const t = i / n, x = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * (x1 + x2) / 2 + t * t * x2, y = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * ((y1 + y2) / 2 + sag * 2) + t * t * y2, c = CONF[i % 6]; s += `<circle cx="${x.toFixed(0)}" cy="${(y + 12).toFixed(0)}" r="18" fill="${c}" opacity=".25"/><ellipse cx="${x.toFixed(0)}" cy="${(y + 12).toFixed(0)}" rx="8" ry="11" fill="${c}"/><rect x="${(x - 4).toFixed(0)}" y="${(y - 2).toFixed(0)}" width="8" height="6" fill="#55546A"/>`; }
  return s;
}
function festBackSVG(){

const Fest = {
  async enter(){
    const tok = newRun();
    const el = $('#fest');
    el.innerHTML = `<div class="art">${festBackSVG()}</div><div class="f-crowd"></div><div class="f-items"></div><div class="fest-cast"></div><div class="fest-meter"></div>`;

      const crowd = $('.f-crowd', el);
      FEST_HOSTS.forEach(([k, x], i) => { const a = makeActor(k); a.style.cssText = `left:${Math.round(STAGE_W * FEST_HX[i]) - 75}px;top:${196 + (i % 2) * 14}px;width:150px;height:262px`; a.classList.add('f-host'); a.style.animationDelay = (-i * .23).toFixed(2) + 's'; crowd.append(a); });
    }

      const F = FEST[k]; if (!F.fest) continue;
      const [x, y, sc] = F.fest, w = 120 * sc, got = Store.has(k), W = WORLDS[F.world];
      const d = h('button', { type:'button', class:'fslot' + (got ? '' : ' missing') + (all ? ' dance' : ''), 'data-k':k, 'aria-label':got ? F.name : 'Missing: ' + F.name }, festIcon(k, w, w) + (got ? '' : `<b style="background:${W ? W.color : '#999'}">?</b>`));
      d.style.left = DX(x) + 'px'; d.style.top = y + 'px'; d.style.width = w + 'px'; d.style.height = w + 'px';
      d.style.animationDelay = (-Math.random()).toFixed(2) + 's';

      box.append(d);
    }
    $('.fest-meter', el).innerHTML = FEST_ORDER.map(k => `<i class="${Store.has(k) ? 'on' : ''}" style="--wc:${WORLDS[FEST[k].world] ? WORLDS[FEST[k].world].color : '#999'}"></i>`).join('');

    const hero = makeActor('hero'); hero.style.cssText = `left:${DX(240)}px;top:330px;width:240px;height:377px`; cast.append(hero);
    const z = makeActor('zizi'); z.style.cssText = `left:${DX(420)}px;top:568px;width:120px;height:138px`; cast.append(z);
    if (all){
      HERO_IDS.filter(k => k !== Store.hero()).forEach((k, i) => { const a = makeActor(k); a.style.cssText = `left:${DX(i ? 805 : 650)}px;top:212px;width:150px;height:235px`; a.classList.add('f-dancer'); cast.append(a); });
      hero.classList.add('f-dancer'); z.classList.add('f-dancer');
    }
    showScreen('fest');
    await Iris.open(STAGE_W / 2, 420);
    if (tok !== RUN) return;
    try {
      if (all){
        const p = Store.p(); p.festSeen = true; Store.save();
        audio(); musicStart(); SFX.fanfare(); confetti(STAGE_W / 2, 300, 120, 1.3);
        HERO_IDS.forEach(k => { pose(k, 'cheer'); face(k, 'happy'); }); pose('zizi', 'cheer'); face('zizi', 'excited');

        await say(n ? 'fest_some' : 'fest_none', { n, left:FEST_ORDER.length - n });
      }
    } catch (e) { if (e !== CANCEL) throw e; }
  }

async function shareRound(S, owners, n, key){

  const D = dnd(pool, Z, { tapTo:(it, cur) => { if (cur) return null; const z = Z[turn % Z.length]; turn++; return z; }, changed(){ sync(); } });

  const check = () => { const left = pool.length - Z.reduce((a, z) => a + z.list.length, 0); if (left) return { left }; const c = Z.map(z => z.list.length); return c.every(v => v === c[0]) ? true : { c }; };

function farmLeaf(x, y, rx, ry, rot, c = '#4FB36A'){ return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${x} ${y})" fill="${c}"/><path d="M${x - rx * .7} ${y} H${x + rx * .7}" transform="rotate(${rot} ${x} ${y})" stroke="#FFF" stroke-width="1.5" opacity=".35"/>`; }

function farmPlantInner(stage){

async function farmPour(can, pot){
  const px = pot._x + parseFloat(pot.style.width) * .5, py = pot._y + parseFloat(pot.style.height) * .2;
  can.style.zIndex = 70; can.classList.remove('live', 'fa-sel');

  can.classList.remove('fa-pour');
}

async function farmGrowFix(S){
  const W = BOARD.w, H = BOARD.h, pw = 138, ph = 196;
  const sunW = Math.round(W * .6);
  deco(`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><ellipse cx="50" cy="50" rx="50" ry="50" fill="#FFE9A0" opacity=".6"/></svg>`, 32, H - 256, sunW - 52, 214);
  deco(farmSunSVG(), 30, 24, 124, 124, 'fa-sun');
  const tx = sunW, tw = W - sunW - 36;
  deco(`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><ellipse cx="50" cy="50" rx="50" ry="50" fill="#2B4A2A" opacity=".28"/></svg>`, tx, H - 230, tw, 190);
  deco(farmTreeSVG(), tx + tw / 2 - 160, 48, 270, 312).style.zIndex = 2;
  const py = H - ph - 56, step = Math.min(180, (sunW - 50 - pw) / 2);
  const sx0 = Math.max(24, (sunW - (2 * step + pw)) / 2), sunSlots = [0, 1, 2].map(i => sx0 + i * step);
  const shadeX = tx + tw / 2 - pw / 2;
  const plan = S.replay ? shuffle([0, 1]) : [0, 1];
  const mk = (role, x, inSun, wet) => { const p = obj(farmPotSVG(wet ? 'wet' : 'dry', inSun && wet ? 'plant' : 'droopy'), pw, ph, { x, y:py, label:role === 'shade' ? 'Plant in the shade' : role === 'dry' ? 'Thirsty plant' : 'Happy plant', cls:inSun ? '' : 'fa-dark' }); p.dataset.role = role; p.inSun = inSun; p.wet = wet; p.style.zIndex = 22; return p; };
  const pots = [mk('dry', sunSlots[plan[0]], true, false), mk('ok', sunSlots[plan[1]], true, true), mk('shade', shadeX, false, true)];
  const freeX = sunSlots[2];
  const can = obj(farmCanSVG(), 150, 110, { x:Math.min(sunW - 200, Math.max(180, sunW / 2 - 40)), y:40, label:'Watering can' });
  can._home = [can._x, can._y];
  const happy = p => p.inSun && p.wet;
  const render = p => { farmSet(p, farmPotSVG(p.wet ? 'wet' : 'dry', happy(p) ? 'plant' : 'droopy')); p.classList.toggle('fa-dark', !p.inSun); if (happy(p)){ pulse(p, 'fa-grow', 900); p.classList.remove('live'); } };
  const sync = () => Goal.count(FARM_ICON.pot, pots.filter(happy).length, 3);
  pots.forEach(p => { if (happy(p)) p.classList.remove('live'); });
  sync();
  let canSel = false, busy = false;
  const water = async p => {
    if (busy){ flyTo(can, can._home[0], can._home[1], 300, 30); return; } busy = true;
    try {
      canSel = false; can.classList.remove('fa-sel');
      if (p.wet){ S.misses++; await missBeat(p); await flyTo(can, can._home[0], can._home[1], 400, 40); can.style.zIndex = ''; can.classList.add('live'); await say('grow_wet'); return; }
      await farmPour(can, p); p.wet = true; render(p); SFX.wake(); sync();
      await flyTo(can, can._home[0], can._home[1], 400, 40); can.style.zIndex = ''; can.classList.add('live');
    } finally { busy = false; }
  };
  const toSun = async p => {
    if (busy || p.inSun) return; busy = true;
    try { SFX.pop(); await flyTo(p, freeX, py, 600, 90); SFX.drop(); p.inSun = true; render(p); sync(); }
    finally { busy = false; }
  };
  draggable(can, {
    can:() => !busy,
    onTap:() => { canSel = !canSel; can.classList.toggle('fa-sel', canSel); SFX.lift(); },
    onDrop:async q => { const p = pots.find(pp => q.x > pp._x - 30 && q.x < pp._x + pw + 30 && q.y > pp._y - 90 && q.y < pp._y + ph); if (p) await water(p); else await flyTo(can, can._home[0], can._home[1], 300, 30); }
  });
  pots.forEach(p => draggable(p, {
    can:() => !busy,
    onTap:async () => {
      if (canSel) return water(p);
      if (!p.inSun) return toSun(p);
      wiggle(p); if (!p.wet && !p._told){ p._told = 1; say('grow_use_can').catch(() => {}); }
    },
    onDrop:async q => { if (!p.inSun && q.x < sunW) await toSun(p); else await flyTo(p, p.inSun ? (p === pots[2] ? freeX : p._x0) : shadeX, py, 300, 30); }
  }));
  pots.forEach(p => { p._x0 = p._x; });
  const bell = bellButton(BOARD.w - 150, 24);
  await ask('grow_fix');
  if (!S.replay) await say('grow_fix_tip');
  await untilBell(S, bell, () => pots.every(happy) || pots.find(p => !happy(p)), async (p, m) => {
    if (m >= 3){ await say('grow_fix_model'); for (const q of pots){ if (!q.inSun) await toSun(q); if (!q.wet){ canSel = false; await water(q); } } bell.el.classList.add('glowing'); return; }
    if (m >= 2) p.classList.add('glowing');
    await say(!p.inSun ? 'grow_shade' : 'grow_thirsty');
  });
  bell.show(false); can.classList.remove('live');
  pots.forEach(p => { p.classList.remove('glowing'); farmSet(p, farmPotSVG('wet', 'flower')); pulse(p, 'fa-grow', 900); });
  SFX.sparkle();
  await successBeat('grow_fix_yes', {}, pots);
}

/* ---------- Life cycles: put the pictures in order ---------- */
const FARM_SETS = {
  bean:[['seed', 'seed', 'farm_w_seed'], ['sprout', 'sprout', 'farm_w_sprout'], ['plant', 'plant', 'farm_w_plant']],
  hen:[['egg', 'egg', 'farm_w_egg'], ['hatch', 'hatching', 'farm_w_hatch'], ['chick', 'chick', 'farm_w_chick'], ['hen', 'hen', 'farm_w_hen']],
  fly:[['fegg', 'egg', 'farm_w_egg'], ['cat', 'caterpillar', 'farm_w_cat'], ['chrys', 'chrysalis', 'farm_w_chrys'], ['fly', 'butterfly', 'farm_w_fly']]
};
async function farmCycleRound(S, setId, askKey, yesKey, col){
  const W = BOARD.w, H = BOARD.h, set = FARM_SETS[setId], n = set.length, gap = 48;
  const cw = Math.min(n === 3 ? 196 : 178, (W - 80 - (n - 1) * gap) / n), ch = cw * 150 / 140;
  const sy = 66, xs = rowX(n, cw, W / 2, W - 60, gap);
  const icon = nest(farmCardSVG(set[n - 1][0], '', col), 46, 50, 4, 2);
  const slots = xs.map((x, i) => {
    const z = zone(x - 6, sy - 6, cw + 12, ch + 12, { cls:'fa-slot', html:`<span class="fa-sn">${i + 1}</span>` });
    z.max = 1; z.slot = () => ({ x, y:sy, z:30 }); z.idx = i;
    if (i < n - 1) deco(`<svg viewBox="0 0 48 40"><path d="M4 20 H34" stroke="#3E9B5A" stroke-width="8" stroke-linecap="round"/><path d="M28 6 L44 20 L28 34Z" fill="#3E9B5A"/></svg>`, x + cw + 4, sy + ch / 2 - 18, gap - 8, 36);
    return z;
  });
  let order = shuffle(set.map((_, i) => i)); if (order.every((v, i) => v === i)) order.reverse();
  const pxs = rowX(n, cw, W / 2, W - 60, 30), py = H - ch - 40;
  const cards = order.map((idx, i) => { const [k, word, wkey] = set[idx]; const c = obj(farmCardSVG(k, word, col), cw, ch, { x:pxs[i], y:py, d:i * 90, label:word }); c._idx = idx; c._w = wkey; c.dataset.idx = idx; return c; });
  let fillRes = null;
  const nextFill = () => new Promise(r => { fillRes = r; });
  const filled = () => slots.filter(z => z.list.length).length;
  const D = dnd(cards, slots, {
    tapTo:(it, cur) => cur ? null : (slots.find(z => !z.list.length) || undefined),
    changed:(it, z) => { Goal.count(icon, filled(), n); if (z){ farmWord(it._w); it.classList.remove('glowing'); } if (filled() === n && fillRes){ const r = fillRes; fillRes = null; r(); } }
  });
  Goal.count(icon, 0, n);
  let wrong = [];
  const sendBack = async () => { for (const z of wrong){ const c = z.list[0]; if (c){ c.classList.add('glowing'); await D.move(c, null); setTimeout(() => c.classList.remove('glowing'), 1600 * FAST); } } };
  const miss = ladder(S, [
    async () => { await say('cycle_h1'); await sendBack(); },
    async () => { await sendBack(); const need = slots.find(z => !z.list.length); if (need){ const c = cards.find(cc => cc._idx === need.idx); c.classList.add('glowing'); await say('cycle_first', { thing:set[need.idx][1] }); } },
    async () => { await say('cycle_h3'); await demo(cards, async () => { for (const z of slots) if (z.list.length && z.list[0]._idx !== z.idx) await D.move(z.list[0], null); for (const z of slots){ if (!z.list.length){ await D.move(cards.find(c => c._idx === z.idx), z); await sleep(250); } } }); }
  ]);
  let p = nextFill();
  await ask(askKey);
  for (;;){
    await p; guard(S.tok);
    await sleep(200);
    if (slots.some(z => !z.list.length)){ p = nextFill(); continue; }
    wrong = slots.filter(z => z.list[0]._idx !== z.idx);
    if (!wrong.length) break;
    p = nextFill();
    await miss(wrong[0].list[0]);
  }
  cards.forEach(c => { c.classList.remove('live', 'glowing'); c._locked = true; });
  SFX.right();
  for (const z of slots){ const c = z.list[0]; pulse(c, 'hop', 500); SFX.count(z.idx + 1); farmWord(c._w); await sleep(800); guard(S.tok); }
  if (setId !== 'bean'){
    const x0 = xs[0] + cw / 2, x1 = xs[n - 1] + cw / 2, yb = sy + ch + 18;
    deco(`<svg viewBox="0 0 ${W} 120" overflow="visible"><path d="M${x1} 0 Q${x1} 60 ${(x0 + x1) / 2} 64 Q${x0} 60 ${x0 + 6} 12" stroke="#F26A1F" stroke-width="8" fill="none" stroke-dasharray="14 10" stroke-linecap="round"/><path d="M${x0 - 10} 26 L${x0 + 6} 2 L${x0 + 20} 28Z" fill="#F26A1F"/></svg>`, 0, yb, W, 120, 'pop-in').style.zIndex = 50;
  }
  await successBeat(yesKey, {}, cards);
  if (setId !== 'bean') await say('cycle_round');
}

/* ---------- Feeding time: sorting ---------- */
/* targets: [{ id, svg, vw, vh, accept(item) }]; things: [{ key, svg, w, h, label }] */
function farmSorter(S, targets, things, o){
  const W = BOARD.w, H = BOARD.h, k = targets.length;
  const tw = Math.min(o.tw || 240, (W - 60) / k - 26), xs = rowX(k, tw, W / 2, W - 50, 30);
  const zones = targets.map((t, i) => {
    const x = xs[i];
    let ah = Math.min(o.th || 200, tw * t.vh / t.vw), aw = ah * t.vw / t.vh;
    if (t.hoop){ deco(`<svg viewBox="0 0 240 120" preserveAspectRatio="none"><ellipse cx="120" cy="60" rx="114" ry="54" fill="${t.fill}" opacity=".35"/><ellipse cx="120" cy="60" rx="114" ry="54" fill="none" stroke="${t.ring}" stroke-width="9"/></svg>`, x, o.ty, tw, ah); aw = tw; }
    else { deco(t.svg, x + (tw - aw) / 2, o.ty, aw, ah).style.zIndex = 3; if (o.trough) deco(farmTroughSVG(), x + tw / 2 - 90, o.ty + ah + 6, 180, 58).style.zIndex = 4; }
    const z = zone(x - 8, o.ty - 10, tw + 16, ah + (t.hoop ? 20 : 80), { cls:'art', html:t.label ? `<span class="zl">${t.icon || ''}${t.label}</span>` : '' });
    if (t.label) z.el.querySelector('.zl').style.top = (t.hoop ? ah + 18 : -26) + 'px';
    z.t = t; z.art = z.el; z.x0 = x; z.aw = tw; z.ah = ah;
    const fw = o.fw || 80;
    z.slot = j => t.hoop ? { x:x + 16 + (j % 3) * (tw - 32 - fw) / 2, y:o.ty + ah * .42 - fw * .5 - Math.floor(j / 3) * 26 + (j % 2) * 10, z:30 + j } : { x:x + tw / 2 - fw / 2 + (j - .5) * fw * .7, y:o.ty + ah - fw * .5 + 16, z:40 + j };
    const btn = h('button', { class:'fa-btn', type:'button', 'aria-label':t.name, 'data-target':t.id }); btn.style.cssText = `left:${x}px;top:${o.ty - 10}px;width:${tw}px;height:${ah + (o.trough ? 76 : 30)}px`;
    BUI().append(btn); z.btn = btn;
    return z;
  });
  const fw = o.fw || 80, items = shuffle(things.slice());
  const pxs = rowX(items.length, fw, W / 2, W - 110, 20);
  const els = items.map((t, i) => { const el = obj(t.svg, fw, fw * (t.h || 1), { x:pxs[i], y:H - 36 - fw * Math.max(1, t.h || 1), d:i * 70, label:t.label }); el._t = t; el.dataset.key = t.key; return el; });
  return { zones, els };
}
async function farmSortRun(S, sorter, o){
  const { zones, els } = sorter;
  let sel = null, busy = false, placed = 0, resAll;
  const allDone = new Promise(r => { resAll = r; });
  const select = it => { if (sel) sel.classList.remove('fa-sel'); sel = it; if (it){ it.classList.add('fa-sel'); SFX.lift(); } };
  let m = 0;
  const D = dnd(els, zones, {
    tapTo:(it, cur) => { if (cur) return undefined; select(sel === it ? null : it); return null; },
    accept:async (it, z) => {
      select(null);
      if (o.ok(it, z)) return true;
      S.misses++; m++; S.hints = Math.max(S.hints, Math.min(3, m));
      await missBeat(it); guard(S.tok);
      await o.wrong(it, z);
      const rz = zones.find(zz => o.ok(it, zz));
      if (m >= 2){ rz.btn.classList.add('glow'); it.classList.add('glowing'); setTimeout(() => { rz.btn.classList.remove('glow'); it.classList.remove('glowing'); }, 2600 * FAST); }
      if (m >= 3) setTimeout(() => { if (!it._locked) D.tapMove(it, rz); }, 700 * FAST);
      return false;
    },
    changed:(it, z) => {
      if (!z || D.zoneOf(it) !== z) return;
      it._locked = true; it.classList.remove('live', 'fa-sel'); placed++;
      pulse(z.btn, 'fa-munch', 600); SFX.count(placed); if (o.placed) o.placed(it, z);
      Goal.count(o.icon, placed, els.length);
      if (placed === els.length) setTimeout(resAll, 500 * FAST);
    }
  });
  zones.forEach(z => z.btn.addEventListener('click', async () => {
    if (busy) return;
    if (!sel){ wiggle(z.btn); if (!z.btn._told){ z.btn._told = 1; say(o.pickKey || 'feed_pick').catch(() => {}); } return; }
    busy = true; const it = sel; select(null);
    try { await D.move(it, z, 'tap'); } finally { busy = false; }
  }));
  Goal.count(o.icon, 0, els.length);
  await ask(o.ask);
  await allDone; guard(S.tok);
}
const FARM_ANIMALS = {
  goat:{ id:'goat', name:'Goat', svg:goatSVG(), vw:140, vh:110, eats:'grass' },
  hen:{ id:'hen', name:'Hen', svg:farmHenSVG(), vw:140, vh:130, eats:'corn' },
  rabbit:{ id:'rabbit', name:'Rabbit', svg:farmRabbitSVG(), vw:130, vh:150, eats:'carrot' }
};
async function farmFeedRound(S, ids, per, askKey){
  const targets = ids.map(id => FARM_ANIMALS[id]);
  const things = []; targets.forEach(t => { for (let i = 0; i < per; i++) things.push({ key:t.eats, svg:FARM_FOOD[t.eats], label:t.eats }); });
  const sorter = farmSorter(S, targets, things, { ty:36, th:196, fw:104, trough:true });
  sorter.zones.forEach(z => z.btn.dataset.eats = z.t.eats);
  await farmSortRun(S, sorter, {
    ask:askKey, icon:FARM_ICON.grass,
    ok:(it, z) => it._t.key === z.t.eats,
    wrong:async (it, z) => { await say('feed_' + z.t.id + '_no'); if (S.misses >= 2) await say('feed_h2'); },
    placed:() => { SFX.pop(); }
  });
  await successBeat('feed_yes', {}, sorter.els);
}

async function farmLiving(S){
  const live = S.replay ? shuffle(['goat', 'tree', 'flower', 'hen']).slice(0, 3) : ['goat', 'tree', 'flower'];
  const dead = S.replay ? shuffle(['rock', 'bucket', 'ball', 'spoon']).slice(0, 3) : ['rock', 'bucket', 'ball'];
  const things = live.concat(dead).map(k => { const T = FARM_THING[k]; return { key:k, svg:T.svg(), h:T.h / T.w, label:T.name, alive:T.alive }; });
  const targets = [{ id:'alive', name:'Living', label:'Living', icon:farmLeafIcon().replace('<svg', '<svg width="30" height="30"'), hoop:true, fill:'#BFE59A', ring:'#3E9B5A', vw:240, vh:120 },
    { id:'not', name:'Not living', label:'Not living', icon:FARM_THING.rock.svg().replace('<svg', '<svg width="30" height="24"'), hoop:true, fill:'#D9D3DA', ring:'#7E7680', vw:240, vh:120 }];
  const sorter = farmSorter(S, targets, things, { ty:96, th:190, tw:350, fw:112 });
  sorter.zones.forEach(z => z.btn.dataset.alive = z.t.id === 'alive' ? '1' : '0');
  await farmSortRun(S, sorter, {
    ask:'live_ask', icon:FARM_ICON.live, pickKey:'feed_pick',
    ok:(it, z) => it._t.alive === (z.t.id === 'alive'),
    wrong:async it => { await say(it._t.alive ? 'live_no_dead' : 'live_no_alive', { thing:it._t.label }); if (S.misses === 2) await say('live_h2'); }
  });
  await successBeat('live_yes', {}, sorter.els);
}

    async () => { await say('circuit_lights_model'); for (const z of Cc.zs){ const e = z.list[0]; if (e && e.dataset.c !== '1') await D.move(e, null); } for (const z of Cc.zs){ if (!z.list.length){ const g = items.find(e => e.dataset.c === '1' && !D.zoneOf(e)); if (g) await D.move(g, z); } } sw.classList.add('glow'); }
  ]);

  }

    const b = h('button', { class:'bu-tgt', type:'button', 'aria-label':t.label || 'Here', 'data-t':t.key });
    b.style.cssText = `left:${t.z.x}px;top:${t.z.y}px;width:${t.z.w}px;height:${t.z.h}px`;

      const it = sel; select(null); busy = true;

    });

  items.forEach(it => {
    if (!it._home) it._home = [it._x, it._y];
    draggable(it, {
      can: () => !busy && !it._locked && (!o.can || o.can(it)),
      onTap: async () => {
        if (busy) return;
        const t = o.tapTo ? o.tapTo(it) : null;
        if (t){ select(null); busy = true; try { await o.place(it, t); } finally { busy = false; } return; }
        SFX.lift(); select(sel === it ? null : it);
      },
      onMove: p => { const t = pickAt(p); zs.forEach(z => z.hot(!!t && z === t.z)); },
      onDrop: async p => {

        try { if (t) await o.place(it, t); else await flyTo(it, it._home[0], it._home[1], 300, 30); }
        finally { busy = false; }

    });
  });

}

function buildRiverKit(gaps, o = {}){
  const IN = 28, inner = BOARD.w - 2 * IN;
  const n = gaps.reduce((a, b) => a + b, 0) + (gaps.length - 1);
  const minBank = o.minBank || 90;
  const U = Math.max(56, Math.min(o.maxU || 100, Math.floor((inner - 2 * minBank) / n)));
  const span = n * U, bank = (inner - span) / 2;
  const deckY = 196, waterTop = deckY + 8, waterBot = 346;
  const ph = Math.max(32, Math.round(44 * U / 100));
  deco(`<svg viewBox="0 0 400 150" preserveAspectRatio="none" style="overflow:hidden"><rect x="0" y="0" width="400" height="150" fill="url(#bu-riverT)"/></svg>`, IN + bank - 20, waterTop, span + 40, waterBot - waterTop).style.zIndex = 2;
  const block = (x, w, side) => deco(`<svg viewBox="0 0 100 200" preserveAspectRatio="none"><rect x="0" y="0" width="100" height="200" fill="url(#bu-soilT)"/><rect x="0" y="0" width="100" height="14" fill="#7DB640"/><rect x="0" y="12" width="100" height="5" fill="#5E9A34"/>${side ? '' : '<rect x="0" y="0" width="100" height="200" fill="url(#c-shadeR)" opacity=".5"/>'}</svg>`, x, deckY, w, waterBot - deckY + 12);
  block(IN, bank, 0).style.zIndex = 3; block(BOARD.w - IN - bank, bank, 1).style.zIndex = 3;
  const G = []; let x = IN + bank;
  gaps.forEach((g, i) => {
    const gp = { x0:x, len:g, filled:0, planks:[], cells:[] };
    for (let k = 0; k < g; k++){ const c = h('div', { class:'bu-cell' + (k % 2 ? ' alt' : ''), 'aria-hidden':'true' }); c.style.cssText = `left:${x + k * U + 2}px;top:${deckY + 2}px;width:${U - 4}px`; PLAYEL().append(c); gp.cells.push(c); }
    if (o.posts) for (let k = 1; k < g; k++) deco(`<svg viewBox="0 0 20 100" preserveAspectRatio="none"><rect x="3" y="0" width="14" height="100" rx="4" fill="#7E8AA8"/><rect x="3" y="0" width="5" height="100" fill="#FFF" opacity=".3"/></svg>`, x + k * U - 9, deckY + 4, 18, waterBot - deckY + 4).style.zIndex = 3;
    G.push(gp); x += g * U;
    if (i < gaps.length - 1){ block(x, U, 0).style.zIndex = 3; x += U; }
  });
  return { U, deckY, waterTop, waterBot, bank, IN, G, ph };
}
function buildPlanks(lens, R){
  const items = [], maxW = BOARD.w - 80, gap = 26;
  const rows = []; let row = [], wsum = 0;
  lens.forEach(L => { const w = L * R.U; if (row.length && wsum + gap + w > maxW){ rows.push(row); row = []; wsum = 0; } row.push(L); wsum += (row.length > 1 ? gap : 0) + w; });
  if (row.length) rows.push(row);
  const y0 = R.waterBot + 30, rowH = R.ph + 20;
  rows.forEach((r, ri) => {
    const tot = r.reduce((a, L) => a + L * R.U, 0) + gap * (r.length - 1);
    let x = BOARD.w / 2 - tot / 2;
    r.forEach(L => { const el = obj(buildPlankSVG(L), L * R.U, R.ph, { x, y:y0 + ri * rowH, d:items.length * 70, label:'Plank ' + L + ' long' }); el._len = L; el.dataset.len = L; el._home = [x, y0 + ri * rowH]; items.push(el); x += L * R.U + gap; });
  });
  return items;
}

function buildPlankPlay(S, R, planks, o){

  const gapAt = p => R.G.find(g => p.x > g.x0 - R.U * .5 && p.x < g.x0 + g.len * R.U + R.U * .5 && p.y > R.deckY - 150 && p.y < R.waterBot);

  planks.forEach(el => draggable(el, {
    can:() => !busy && !el._locked,
    onTap:() => run(el, openGap()),
    onDrop:p => run(el, gapAt(p))
  }));
}

function buildWindKit(){
  const base = BOARD.h - 66;
  deco(`<svg viewBox="0 0 400 30" preserveAspectRatio="none"><rect x="0" y="0" width="400" height="30" rx="10" fill="url(#bu-sand)"/><rect x="0" y="0" width="400" height="8" rx="4" fill="#7DB640"/></svg>`, 30, base, BOARD.w - 60, 30).style.zIndex = 2;
  const fan = deco(buildFanSVG(), 40, base - 230, 165, 231, 'bu-fan'); fan.style.zIndex = 6;
  const wind = deco(buildWindSVG(400), 200, base - 280, BOARD.w - 250, 180, 'bu-wind'); wind.style.zIndex = 28;
  return { base, fan, wind, on(v){ fan.classList.toggle('bu-on', v); wind.classList.toggle('bu-on', v); } };
}
async function buildWindTest(S){
  const K = buildWindKit(), fs = Math.min(240, BOARD.w * .25);
  const sqX = BOARD.w * .48 - fs / 2, trX = BOARD.w * .78 - fs / 2, fy = K.base - fs + 6;
  const sq = obj(buildFrameSVG('square'), fs, fs, { x:sqX, y:fy, label:'Square frame', d:100 }); sq.dataset.k = 'square';
  const tr = obj(buildFrameSVG('tri'), fs, fs, { x:trX, y:fy, label:'Triangle frame', d:200 }); tr.dataset.k = 'tri';
  const Q = tapQueue();
  sq.addEventListener('click', () => { SFX.tap(); Q.push('square'); }); tr.addEventListener('click', () => { SFX.tap(); Q.push('tri'); });
  await ask('wind_ask');
  const first = await Q.next(); guard(S.tok);
  (first === 'tri' ? tr : sq).classList.add('bu-chosen');
  [sq, tr].forEach(e => e.classList.remove('live'));
  await say('wind_test');
  K.on(true); SFX.whoosh(); setTimeout(() => SFX.whoosh(), 700 * FAST);
  sq.classList.add('bu-rack'); tr.classList.add('bu-hold');
  await sleep(1500); SFX.drop();
  await sleep(500); K.on(false);
  sq.classList.remove('bu-chosen'); tr.classList.remove('bu-chosen');
  if (first === 'tri'){ await successBeat('wind_tri_right', {}, [tr]); return; }
  /* the square fell: which one stayed up? */
  tr.classList.add('live');
  await ask('wind_sq_fell');
  const miss = ladder(S, [async () => { await say('wind_hint'); }, async () => { tr.classList.add('glowing'); }, async () => { tr.classList.add('glowing'); await say('wind_hint'); }]);
  for (;;){ const k = await Q.next(); guard(S.tok); if (k === 'tri') break; await miss(sq); }
  tr.classList.remove('glowing', 'live');
  await successBeat('wind_yes', {}, [tr]);
}
async function buildBrace(S){
  const K = buildWindKit(), fs = Math.min(250, BOARD.w * .26);
  const fx = BOARD.w * .44 - fs / 2, fy = K.base - fs + 6;
  const frame = deco(buildFrameSVG('square'), fx, fy, fs, fs); frame.style.zIndex = 8;
  const longW = Math.round(fs * .95), shortW = Math.round(fs * .62);
  const sx = Math.min(BOARD.w - longW - 40, BOARD.w * .66);
  const long = obj(buildStickSVG(240), longW, longW * 30 / 240, { x:sx, y:fy + 20, label:'Long stick', d:120 }); long.dataset.k = 'diag';
  const short = obj(buildStickSVG(150), shortW, shortW * 30 / 150, { x:sx + (longW - shortW) / 2, y:fy + 110, label:'Short stick', d:220 }); short.dataset.k = 'short';
  [long, short].forEach(s => { s._home = [s._x, s._y]; });
  let brace = null;
  const draw = (hl = 0) => { frame.innerHTML = buildFrameSVG('square', brace ? brace.dataset.k : null, hl); };
  const put = async s => {
    if (brace === s) return;
    if (brace){ const old = brace; brace = null; draw(); old.style.opacity = '1'; old.classList.add('live'); await flyTo(old, old._home[0], old._home[1], 360, 50); }
    s.classList.remove('live'); SFX.pop();
    await flyTo(s, fx + fs / 2 - parseFloat(s.style.width) / 2, fy + fs / 2 - 15, 420, 70);
    s.style.opacity = '0'; brace = s; draw(); SFX.drop(); pulse(frame, 'hop', 400);
  };
  const takeOff = async () => { if (!brace) return; const old = brace; brace = null; draw(); old.style.opacity = '1'; old.classList.add('live'); await flyTo(old, old._home[0], old._home[1], 360, 50); };
  const fz = zone(fx - 20, fy - 20, fs + 40, fs + 40, { cls:'art' });
  let busy = false;
  [long, short].forEach(s => draggable(s, { can:() => !busy && !s._locked, onTap:async () => { busy = true; try { await put(s); } finally { busy = false; } }, onMove:p => fz.hot(fz.contains(p)), onDrop:async p => { fz.hot(false); busy = true; try { if (fz.contains(p)) await put(s); else await flyTo(s, s._home[0], s._home[1], 300, 30); } finally { busy = false; } } }));
  const go = goButton(BOARD.w - 150, 24);
  await ask('brace_ask');
  const miss = ladder(S, [async () => { await say('brace_hint'); }, async () => { long.classList.add('glowing'); await say('brace_hint'); }, async () => { long.classList.add('glowing'); await say('brace_hint3'); busy = true; await put(long); busy = false; go.el.classList.add('glow'); }]);
  for (;;){
    await go.wait(); guard(S.tok);
    if (!brace){ go.show(false); await say('brace_empty'); go.show(true); continue; }
    busy = true;
    K.on(true); SFX.whoosh(); setTimeout(() => SFX.whoosh(), 700 * FAST);
    if (brace === long){ frame.classList.add('bu-hold'); await sleep(1600); K.on(false); frame.classList.remove('bu-hold'); break; }
    frame.classList.add('bu-rack'); await sleep(1500); SFX.drop(); await sleep(400); K.on(false);
    await say('brace_fell');
    frame.classList.remove('bu-rack'); await takeOff(); pulse(frame, 'pop-in', 500);
    busy = false;
    go.show(false); try { await miss(go.el); } finally { go.show(true); }
    if (brace === long) continue;
  }
  go.remove(); long.classList.remove('glowing'); [long, short].forEach(s => { s._locked = true; s.classList.remove('live'); });
  SFX.right(); react('hero', 'happy', 1800); pulse(rigOf('zizi'), 'pushups', 1500);
  await say('brace_yes');
  Goal.show(`<span class="g-ic"><svg viewBox="0 0 40 40"><path d="M6 34 L20 6 L34 34Z" fill="#FFD23F" stroke="#8C5428" stroke-width="3" stroke-linejoin="round"/></svg></span><span class="g-n"><b>?</b></span>`);
  const T = await askNumber(S, 2, { choices:[1, 2, 3], key:'brace_how', size:112, cx:BOARD.w * .72, y:BOARD.h - 150, hints:[
    async () => { await say('brace_tri_count'); draw(1); SFX.count(1); sayNumber(1); await sleep(800); draw(2); SFX.count(2); sayNumber(2); await sleep(900); draw(0); },
    async () => { draw(2); },
    async () => { draw(2); const b = $('#bui .tile[data-v="2"]'); if (b) b.classList.add('glow'); }
  ] });
  draw(2);
  await T.clear();
  Goal.show(`<span class="g-ic"><svg viewBox="0 0 40 40"><path d="M6 34 L20 6 L34 34Z" fill="#FFD23F" stroke="#8C5428" stroke-width="3" stroke-linejoin="round"/></svg></span><span class="g-n"><b>2</b></span>`);
  await successBeat('brace_count', {}, []);
}

  const isOn = (r, c) => pat.some(([pr, pc]) => pr === r && pc === c);
  const cells = [];
  rows.forEach(([c0, c1], r) => { for (let c = c0; c <= c1; c++){
    const left = c < 3, on = left && isOn(r, c), want = !left && isOn(r, 5 - c);
    const el = obj(adireCellSVG(on), cs - 4, cs - 4, { parent:K, x:c * cs + 2, y:r * cs + 2, d:(r * 6 + c) * 25, plain:true, live:false, cls:'ad-cell' + (left ? ' ad-left' : ' ad-right'), label:left ? 'Pattern square' : 'Empty square' });

  const miss = ladder(S, [
    async () => { await say('adire_mirror_no'); },
    async () => { const sp = say('adire_mirror_h2'); for (const t of targets.filter(e => !e._on)){ const l = twin(t); pulse(l, 'hop', 450); pulse(t, 'nudge', 1000); await sleep(650); } await sp; },
    async () => { const t = targets.find(e => !e._on); if (t) t.classList.add('glowing'); await say('adire_mirror_h3'); }
  ]);
  while (got < need){
    const el = await Q.next(); guard(S.tok);

/* ===== Grown-ups: gate, progress, players, settings, privacy ===== */
function stopStatus(p, wid, sid){
  const ev = p.log.filter(e => e.w === wid && e.s === sid);
  if (!ev.length) return { k:'none', label:'Not started', ev };
  const last = ev.slice(-3);
  if (last.length === 3 && last.every(e => e.misses === 0 && e.hints === 0)) return { k:'secure', label:'Confident', ev };
  return { k:'practising', label:'Practising', ev };
}
function fmtMins(ms){ const m = Math.round((ms || 0) / 60000); return m < 1 ? 'under a minute' : m === 1 ? '1 minute' : m + ' minutes'; }

  el: $('#parent'), passedAt: 0, tab: 'progress',
  open(tab){
    stopSpeech(); musicStop(); Portal.stop();
    this.tab = tab || this.tab || 'progress';

    if (Date.now() - this.passedAt < 5 * 60000) this.render(); else this.gate();
  },
  close(){
    this.el.hidden = true; this.el.innerHTML = '';
    if (Store.s.settings.music && AC) musicStart();
    updateFest();
  },
  gate(msg){
    const a = rnd(6, 9), b = rnd(6, 9), ans = a * b;
    this.el.innerHTML = `<div class="pg-card gate" role="dialog" aria-modal="true" aria-labelledby="pg-t">
      <button class="pg-x" type="button" aria-label="Close">×</button>
      <h2 id="pg-t">For grown-ups</h2>
      <p>${msg || 'Answer this to continue.'}</p>
      <div class="gate-q">What is ${a} × ${b}?</div>
      <div class="gate-in" aria-live="polite"></div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(k => `<button type="button" data-k="${k}">${k}</button>`).join('')}</div></div>`;
    let val = '';
    const show = () => { $('.gate-in', this.el).textContent = val || ' '; };
    show();
    $('.pg-x', this.el).onclick = () => this.close();
    $$('.keypad button', this.el).forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'C') val = ''; else if (k === 'OK'){ if (+val === ans){ this.passedAt = Date.now(); this.render(); } else this.gate('Not quite. Try this one.'); return; }
      else if (val.length < 3) val += k;

    });

            ${P.detail ? `<p>${P.detail}</p>` : ''}<p class="small">${where}${ss.ev.length ? `. ${ss.ev.length} round${ss.ev.length === 1 ? '' : 's'} played, help needed ${hints} time${hints === 1 ? '' : 's'}` : ''}.</p>
            ${P.home ? `<p class="try"><b>Try at home:</b> ${P.home}</p>` : ''}${P.links ? `<p class="small">${P.links}</p>` : ''}</div>`;

    $$('[data-play]', this.el).forEach(b => b.onclick = () => { Store.s.current = b.dataset.play; Store.save(); this.render(); switchedPlayer(); });
    $$('[data-del]', this.el).forEach(b => b.onclick = () => { const q = Store.s.profiles.find(x => x.id === b.dataset.del); if (!q || !confirmInline(b, `Remove ${q.name}?`)) return; Store.s.profiles = Store.s.profiles.filter(x => x.id !== q.id); if (Store.s.current === q.id) Store.s.current = Store.s.profiles[0].id; Store.save(); this.render(); switchedPlayer(); });
    const add = $('#pg-add', this.el); if (add) add.onclick = () => { const n = Store.s.profiles.length; const q = Store.newProfile('Player ' + (n + 1), COLORS[n % COLORS.length]); Store.s.profiles.push(q); Store.save(); this.render(); };
    const code = $('#pg-code', this.el); if (code) code.value = exportCode(p);
    const cp = $('#pg-copy', this.el); if (cp) cp.onclick = () => { code.select(); try { navigator.clipboard.writeText(code.value).then(() => { $('#pg-msg').textContent = 'Copied.'; }, () => { document.execCommand('copy'); }); } catch (e) { document.execCommand('copy'); } };
    const ld = $('#pg-load', this.el); if (ld) ld.onclick = () => { const r = importCode($('#pg-paste').value); $('#pg-msg', this.el).textContent = r ? `Loaded ${r}'s progress.` : "That code didn't work. Check it was copied in full."; if (r){ switchedPlayer(); setTimeout(() => this.render(), 900); } };
    const rs = $('#pg-reset', this.el); if (rs) rs.onclick = () => { if (!confirmInline(rs, 'Tap again to clear')) return; const q = Store.p(); Object.assign(q, { worlds:{}, items:[], log:[], seen:[], worldsSeen:{}, introSeen:false, festSeen:false, playMs:0 }); Store.save(); this.render(); switchedPlayer(); };
    const sc = $('#pg-script', this.el); if (sc) sc.onclick = () => { const out = $('#pg-scriptout', this.el); out.hidden = false; out.value = voiceScript(); };

function confirmInline(btn, text){ if (btn.dataset.armed === '1') return true; btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = text; setTimeout(() => { btn.dataset.armed = '0'; if (btn.isConnected) btn.textContent = btn.dataset.orig; }, 3000); return false; }
function exportCode(p){ try { return 'FT1.' + btoa(unescape(encodeURIComponent(JSON.stringify({ n:p.name, c:p.color, h:p.hero, i:p.introSeen, w:p.worlds, it:p.items, se:p.seen, ws:p.worldsSeen, lg:p.log.slice(-200), ms:p.playMs })))); } catch (e) { return ''; } }
function importCode(s){
  try {
    s = (s || '').trim(); if (!s.startsWith('FT1.')) return null;
    const d = JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));
    const q = Store.newProfile(String(d.n || 'Player').slice(0, 20), d.c || COLORS[0]);
    Object.assign(q, { hero:HERO_IDS.includes(d.h) ? d.h : null, introSeen:!!d.i, worlds:d.w || {}, items:Array.isArray(d.it) ? d.it : [], seen:Array.isArray(d.se) ? d.se : [], worldsSeen:d.ws || {}, log:Array.isArray(d.lg) ? d.lg : [], playMs:+d.ms || 0 });
    if (Store.s.profiles.length >= 5) Store.s.profiles.pop();
    Store.s.profiles.push(q); Store.s.current = q.id; Store.save();
    return q.name;
  } catch (e) { return null; }
}

function voiceRows(){
  const rows = [], S = VO_SLOTS;
  const nm = w => w === 'zizi' ? 'Zizi' : KIDS[w] ? KIDS[w].name : w === 'bisi' ? 'Mama Bisi' : w === 'femi' ? 'Uncle Femi' : HOSTS[w] ? HOSTS[w].name : w;
  for (const k in LINES){
    const [w, t] = LINES[k], variants = Array.isArray(t) ? t : [t];
    for (const sp of (w === 'hero' ? HERO_IDS : [w])) variants.forEach((v, vi) => {
      for (const kid of ((w !== 'hero' && /\{hero\}/.test(v)) ? HERO_IDS : [null])){
        const base = (w === 'hero' ? sp + '_' : '') + k + (Array.isArray(t) ? '_' + vi : '') + (kid ? '_' + kid : '');
        const who = KIDS[kid || sp];
        let sets = [{}];
        if (/\{thing\}/.test(v)) sets = (S.thing[k] || []).map(thing => ({ thing }));
        else if (/\{[kab]\}/.test(v)) sets = S.combo[k] || [];
        else if (/\{n\}/.test(v)) sets = (S.n[k] || []).map(n => ({ n }));
        for (const o of sets){
          let id = base;
          if (o.thing != null) id += '_' + voSlug(o.thing);
          if (o.k != null) id += '_k' + o.k;
          if (o.a != null) id += '_a' + o.a + '_b' + o.b;
          if (o.n != null) id += '_' + o.n;
          const vv = Object.assign({ hero:who ? who.name : '' }, o); if (o.n != null) vv.left = FEST_ORDER.length - o.n;
          rows.push([id, nm(sp), fill(v, vv)]);
        }
      }
    });
  }
  for (const k of FEST_ORDER){
    const F = FEST[k], W = WORLDS[F.world];
    rows.push(['fest_item_' + k, 'Zizi', `${F.name}, from ${W.name}!`]);
    rows.push(['fest_item_' + k + '_missing', 'Zizi', `We still need something from ${W.name}.`]);
  }
  for (const k of HERO_IDS) for (let n = 1; n <= 12; n++){ const w = numWord(n); rows.push([k + '_num_' + n, KIDS[k].name, w[0].toUpperCase() + w.slice(1)]); }
  return rows;
}
function voiceScript(){
  const esc = t => '"' + t.replace(/"/g, '""') + '"';
  return ['file_id,character,text'].concat(voiceRows().map(r => [r[0], esc(r[1]), esc(r[2])].join(','))).join('\n');
}
function voMissing(){ return voiceRows().map(r => r[0]).filter(id => !VO[id] && !VO_CLIP[id]); }
function applySettings(){
  const S = Store.s.settings;
  /* the system reduced-motion setting works the same as the calm switch */
  app.classList.toggle('reduce-motion', !!S.calm || !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches));
  if (!S.voice) stopSpeech();
  if (S.music && AC) musicStart(); else musicStop();
  const b = $('#b-sound'); if (b) b.setAttribute('aria-pressed', String(!!S.music));
}

/* ===== Boot ===== */
(function boot(){
  document.body.insertAdjacentHTML('afterbegin', DEFS_SVG.replace('</defs>', CDEFS + CAST_DEFS + WDEFS + SDEFS + TDEFS + XDEFS + '</defs>'));
  const css = h('style', {}, WORLD_ORDER.map(w => (WORLDS[w] && WORLDS[w].css) || '').join('\n')); document.head.append(css);
  DLG.el = $('#dlg'); DLG.port = $('#dlg .dp'); DLG.name = $('#dlg .dn'); DLG.text = $('#dlg .dt');
  TASK.el = $('#task'); TASK.port = $('#task .tp'); TASK.text = $('#task .tt'); TASK.goal = $('#task .tg'); TASK.rounds = $('#task .tr');
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 200));
  applySettings();
  try { const mq = matchMedia('(prefers-reduced-motion: reduce)'); if (mq.addEventListener) mq.addEventListener('change', () => applySettings()); } catch (e) {}
  $('#b-back').addEventListener('click', async () => {
    const from = screenId, to = { pick:() => Title.enter(), town:() => Title.enter(), wmap:() => WMap.back(), scene:() => Runner.back(), fest:() => Town.enter() }[from];
    if (!to) return;
    SFX.tap(); const tok = newRun();
    await Iris.close(70, 70);
    if (tok !== RUN || screenId !== from) return;
    to();
  });
  $('#b-fest').addEventListener('click', async () => {
    SFX.tap(); pulse($('#b-fest'), 'hop', 500);
    if (screenId === 'town') return Town.plaza();
    stopSpeech(); const n = festCount();
    say(n ? 'fest_count' : 'fest_count_0', { n }).catch(() => {});
  });
  $('#b-sound').addEventListener('click', () => { audio(); const S = Store.s.settings; S.music = !S.music; Store.save(); applySettings(); SFX.tap(); });
  $('#b-grown').addEventListener('click', () => { SFX.tap(); Parent.open('progress'); });
  stage.addEventListener('pointerdown', () => { lastTouch = Date.now(); }, true);
  $('#task').addEventListener('click', () => { SFX.tap(); sayAgain(); });
  $('#dlg').addEventListener('click', () => { if (skipFn) skipFn(); });
  /* the app going to the background (Home button, another app, the screen locking) pauses sound;
     coming back resumes it. The Android wrapper calls these too. */
  window.FT_APP = {
    paused:false,
    /* recorded lines pause with the sound and carry on after; only a device-voice line is cut */
    pause(){ if (this.paused) return; this.paused = true; musicStop(); if (TTS_ON){ try { speechSynthesis.cancel(); } catch (e) {} } try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {} },
    resume(){ if (!this.paused) return; this.paused = false; try { if (AC) AC.resume().catch(() => {}); } catch (e) {} if (Store.s.settings.music && AC) musicStart(); }
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) FT_APP.pause(); else FT_APP.resume(); });
  window.addEventListener('pagehide', () => FT_APP.pause());
  window.addEventListener('pageshow', e => { if (e.persisted) FT_APP.resume(); });
  /* the phone's own Back (Android gesture, a browser's back button) works like the game's Back button
     instead of leaving the game; on the title screen it leaves as normal */
  let backArmed = false;
  const webOnly = () => !window.FT_TV || window.FT_TV.platform === 'web';   /* the apps handle Back themselves */
  window.armHistoryBack = () => { if (!backArmed && screenId !== 'title' && history.pushState && webOnly()){ try { history.pushState({ ft:1 }, ''); backArmed = true; } catch (e) {} } };
  window.addEventListener('popstate', e => {
    if (!webOnly()) return;
    if (e.state && e.state.ft){ backArmed = true; return; }   /* Forward into the game's entry: nothing to do */
    backArmed = false;
    if (!$('#parent').hidden){ Parent.close(); armHistoryBack(); return; }
    if (screenId === 'title') return;
    const toTitle = screenId === 'pick' || screenId === 'town';
    $('#b-back').click();
    /* re-arm at once, so a second quick Back goes back another screen instead of leaving the site */
    if (!toTitle){ try { history.pushState({ ft:1 }, ''); backArmed = true; } catch (er) {} }
  });
  /* a script error inside an activity must not leave a child stuck: go back to the map */
  let lastRecover = 0;
  window.addEventListener('unhandledrejection', e => {
    if (e.reason === CANCEL){ e.preventDefault(); return; }
    console.error('Festival Town:', e.reason);
    Town.busy = false; WMap.busy = false;   /* a failed start must not leave the town or map ignoring taps */
    const now = Date.now(); if (now - lastRecover < 10000 || screenId !== 'scene' || !Runner.wid) return;
    lastRecover = now;
    const tok = newRun(), wid = Runner.wid;
    setTimeout(async () => { if (tok !== RUN) return; await Iris.close(STAGE_W / 2, 360); if (tok === RUN) WMap.enter(wid); }, 900);
  });
  updateFest();
  Portal.boot();
  Title.enter();
  window.__ft = { Store, Title, Pick, Town, WMap, Runner, Fest, WORLDS, setFast(f){ FAST = f; } };
})();
